# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
# Project information
site_name: Exceller Ensemble
site_url: https://fhiegel.github.io
site_description: >
  Mon espace d'expression, permettant d'apprendre et de partager ma vision de l'Agilité et du Software Craftsmanship, 
  dans le fun et pour le plaisir.
repo_url: https://github.com/fhiegel/fhiegel.github.io
edit_uri: ""

nav:
  - Accueil:
      - index.md
  - Software:
    - topics/software/software-engineering.md
    - topics/software/software-craftsmanship.md
    - ⛩️ La maîtrise personnelle:
        - Les Katas de code:
          - topics/software/practices/katas/index.md
          - topics/software/practices/katas/fizzbuzz/index.md
          - topics/software/practices/katas/game-of-life/index.md
          - topics/software/practices/katas/sailboat/index.md
          - topics/software/practices/katas/rpn/index.md
          - topics/software/practices/katas/mars-rover/index.md
        - S'entrainer:
          - topics/software/practices/coding-dojo.md
          - topics/software/practices/code-retreat.md
    - Les Pratiques:
      - 🚥 Test-Driven Development:
          - topics/software/practices/tdd/index.md
          - topics/software/practices/tdd/as-if-you-meant-it.md
          - topics/software/practices/tdd/outside-in.md
          - topics/software/practices/tdd/triangle-du-developpement/index.md
      - 👥 Collaborer:
          - 👥 Pair-Programming:
              - topics/software/practices/pair-programming/index.md
              - Pair-Practice: topics/software/practices/pair-programming/pair-practice.md
              - Pair-Poetry: topics/software/practices/pair-programming/pair-poetry.md
    - 🫧 Conception logicielle et Qualité de Code:
      - topics/software/design/index.md
      - 🧱 S.O.L.I.D:
          - topics/software/design/principles/solid/index.md
      - ➿ Design Patterns:
          - topics/software/design/patterns/index.md
          - topics/software/design/patterns/gof/index.md
          - topics/software/design/patterns/gof/factory.md
    - 🛠️ Ateliers:
      - Tests Unitaires - Sensibiliser sans coder: topics/sensibiliser-aux-tests-unitaires.md
      - Good Morning Learning: topics/knowledge-management/good-morning-learning/index.md
#  - Knowledge Management:
#    - 🎓 Veille:
#      - topics/knowledge-management/veille/index.md
#      - topics/knowledge-management/veille/activites.md
#      - topics/knowledge-management/veille/phare/index.md
  - Blog:
    - blog/index.md
  - A propos de moi:
    - CV: me/cv.md
    - NoCV: me/nocv.md
not_in_nav: |
  tags.md
  cfp*
  slides*
  **/lt.md
  gamification
  knowledge-management

theme:
  name: material
  custom_dir: theme
  language: fr
  logo: assets/images/icon-128x128.png
  favicon: assets/images/favicon.png
  features:
    - content.code.annotate
#    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    primary: black
    accent: red
  icon: # Recherche : https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/#search
    tag:
      café: simple/coffeescript
      craft: fontawesome/solid/users-gear
      pair-programming: fontawesome/solid/people-group

# Extra
extra_css:
  - assets/css/extra.css

extra:
  tags:
    Café: café
    Pair-programming: pair-programming
    Craft: craft
    craft: craft
    Software Craftsmanship: craft
  author:
    name: fhiegel
    icon: fontawesome/solid/blog
    link: https://fhiegel.github.io
  reveal:
    path: reveal.js/dist
    transition: slide
    theme:
      name: white.css
      path: theme
    plugin:
      path: reveal.js/plugin
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fhiegel
      name: fhiegel on GitHub
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/fhiegel
      name: fhiegel on Twitter
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fabien-hiegel-874416b5
      name: Fabien Hiegel on LinkedIn
    - icon: fontawesome/brands/mastodon
      link: https://techhub.social/@fhiegel
      name: Fabien Hiegel on Mastodon

# Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - markdown_include.include:
      base_path: docs
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - blog:
      blog_toc: true
      post_excerpt: required
      post_excerpt_separator: '<!-- more -->'
  - search
  - tags:
      tags_file: tags.md
  - redirects:
      redirect_maps:
        'learn/presentations/good-morning-learning/index.md': 'topics/knowledge-management/good-morning-learning/index.md'
        'learn/presentations/good-morning-learning/slides/index.md': 'topics/knowledge-management/good-morning-learning/slides/index.md'
        'learn/presentations/good-morning-learning/slides/en.md': 'topics/knowledge-management/good-morning-learning/slides/en.md'
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
  - include-markdown